<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宠物领养管理系统</title>
<style>
:root{--p:#2F7A6B;--pd:#235E53;--a:#E08A5B;--bg:#FAF8F5;--line:#EDE8E2;--muted:#7A7A7A;--ok:#3D9970;--warn:#D98C2B;--bad:#C0453A;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.65 "Microsoft YaHei","PingFang SC",sans-serif;background:linear-gradient(160deg,#DCEDE7 0%,#EDF6F3 38%,#F5FAF8 72%,#E6F2EE 100%);background-attachment:fixed;min-height:100vh;color:#2B2B2B}
a{color:var(--p);text-decoration:none}a:hover{color:var(--pd)}
.navbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.nav-inner{max-width:1100px;margin:0 auto;height:60px;padding:0 18px;display:flex;align-items:center;gap:22px}
.brand{color:var(--p);font-size:18px;font-weight:700;white-space:nowrap}
.nav-links{display:flex;gap:18px;flex:1}
.nav-links a{color:var(--muted);font-size:14px;white-space:nowrap;padding-bottom:2px}
.nav-links a.on{color:var(--p);border-bottom:2px solid var(--p)}
.nav-user{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;white-space:nowrap}
.container{max-width:1100px;margin:0 auto;padding:24px 18px 56px;min-height:60vh}
.footer{text-align:center;color:#AAA;font-size:12px;padding:20px;border-top:1px solid var(--line)}
h2.t{font-size:21px;font-weight:700}
p.sub{color:var(--muted);font-size:13px;margin:4px 0 20px}
.flash{padding:10px 15px;border-radius:9px;margin-bottom:14px;font-size:13px}
.flash.success{background:#E9F5EF;color:var(--ok)}.flash.danger{background:#FBEAE8;color:var(--bad)}
.flash.warn{background:#FDF3E4;color:var(--warn)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card+.card{margin-top:16px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:18px}
.bar input,.bar select{padding:8px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px;outline:none}
.bar input:focus,.bar select:focus{border-color:var(--p)}
.btn{display:inline-block;padding:9px 18px;border:1px solid transparent;border-radius:8px;font:inherit;font-size:13.5px;cursor:pointer;text-align:center;line-height:1.2}
.btn.s{padding:6px 12px;font-size:12.5px}
.btn.p{background:var(--p);color:#fff}.btn.p:hover{background:var(--pd);color:#fff}
.btn.g{background:#fff;border-color:var(--line);color:#333}.btn.g:hover{border-color:var(--p);color:var(--p)}
.btn.d{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.pet{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:.16s}
.pet:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(47,122,107,.1)}
.thumb{height:118px;display:flex;align-items:center;justify-content:center;font-size:50px;background:linear-gradient(135deg,#EAF4F1,#FDF1E8)}
.pbody{padding:12px 14px;flex:1;display:flex;flex-direction:column}
.pname{font-size:15.5px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.pmeta{color:var(--muted);font-size:12px;margin:3px 0 8px}
.pdesc{font-size:12.5px;color:#555;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.code{font:11px Consolas,monospace;color:#AAA}
.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge.available,.badge.approved{background:#E9F5EF;color:var(--ok)}
.badge.pending{background:#FDF3E4;color:var(--warn)}
.badge.adopted,.badge.completed{background:#EDF2F1;color:var(--p)}
.badge.rejected{background:#FBEAE8;color:var(--bad)}
.badge.cancelled{background:#F0F0F0;color:#888}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;color:var(--muted);border-bottom:2px solid var(--line);font-size:12.5px;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#FCFAF7}
td .acts{display:flex;gap:7px;flex-wrap:wrap}
.fg{display:flex;flex-direction:column;gap:5px}
label{font-size:13px;color:#555;font-weight:600}
input,select,textarea{padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13.5px;background:#fff;outline:none;color:#2B2B2B}
input:focus,select:focus,textarea:focus{border-color:var(--p)}
textarea{min-height:84px;resize:vertical}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.full{grid-column:1/-1}
.hint{font-size:12px;color:var(--muted)}
.detail{display:grid;grid-template-columns:300px 1fr;gap:20px}
.big{height:260px;border-radius:var(--r);background:linear-gradient(135deg,#EAF4F1,#FDF1E8);display:flex;align-items:center;justify-content:center;font-size:100px}
.infolist{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:14px;font-size:13px}
.infolist .k{color:var(--muted);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.stat .l{font-size:12.5px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:700;color:var(--p);line-height:1.3}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .i{font-size:44px;margin-bottom:8px}
.auth{max-width:400px;margin:36px auto}
.auth .card{padding:28px}
.auth h3{font-size:19px;margin-bottom:4px}
.auth p{color:var(--muted);font-size:13px;margin-bottom:18px}
@media(max-width:820px){.detail,.form{grid-template-columns:1fr}.nav-inner{height:auto;padding:10px 14px;flex-wrap:wrap;gap:10px}.nav-links{order:3;width:100%;overflow-x:auto}.container{padding:18px 14px 44px}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-inner" id="nav"></div></nav>
<main class="container" id="app"></main>
<footer class="footer">宠物领养管理系统 · 前端演示版（数据保存在本机浏览器）</footer>
<script>
(function () {
'use strict';
var KEY = 'pa_simple_v1', SK = 'pa_simple_session';
var PS = { available: '待领养', adopted: '已领养' };
var AS = { pending: '待审核', approved: '已通过', rejected: '已驳回', completed: '已完成', cancelled: '已取消' };
var HE = { healthy: '健康', sick: '疾病中', recovering: '康复中' };

var storageOK = true;
try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch (e) { storageOK = false; }
var DB = null, uid = null, flash = null, timer = null;
var filters = { kw: '', cat: '' };
var viewName = 'home';

/* ---------- 工具 ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function today() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function ymd() { return today().replace(/-/g, ''); }
function nid(l) { return l.reduce(function (m, x) { return Math.max(m, x.id || 0); }, 0) + 1; }
function pad(n, w) { return String(n).padStart(w, '0'); }
function nextUserCode() { return 'U' + pad(DB.users.length + 1, 6); }
function nextPetCode() { return 'PET-' + new Date().getFullYear() + '-' + pad(DB.pets.length + 1, 3); }
function nextApplyCode() { return 'APL-' + ymd() + '-' + pad(DB.applications.length + 1, 3); }
function me() { return DB.users.filter(function (u) { return u.id === uid; })[0] || null; }
function cname(id) { var c = DB.categories.filter(function (x) { return x.id === Number(id); })[0]; return c ? c.name : '未分类'; }
function save() { if (storageOK) { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { } } }
function saveSession() { if (storageOK) { if (uid) localStorage.setItem(SK, String(uid)); else localStorage.removeItem(SK); } }
function setFlash(t, k) { flash = { t: t, k: k || 'success' }; if (timer) clearTimeout(timer); timer = setTimeout(function () { flash = null; timer = null; }, 4000); }

/* ---------- 演示数据 ---------- */
function seed() {
  return {
    users: [
      { id: 1, user_code: 'U000001', username: 'admin', password: 'admin123', real_name: '系统管理员', phone: '13800000000', role: 'admin' },
      { id: 2, user_code: 'U000002', username: 'zhangsan', password: '123456', real_name: '张三', phone: '13812345678', role: 'user' },
      { id: 3, user_code: 'U000003', username: 'lisi', password: '123456', real_name: '李四', phone: '13987654321', role: 'user' }
    ],
    categories: [
      { id: 1, name: '猫' }, { id: 2, name: '犬' }, { id: 3, name: '兔' }, { id: 4, name: '仓鼠' }, { id: 5, name: '其他' }
    ],
    pets: [
      { id: 1, pet_code: 'PET-2026-001', name: '橘子', category_id: 1, breed: '中华橘猫', gender: '公', age_month: 18, weight_kg: 4.2, health_status: 'healthy', status: 'available', intake_date: '2026-06-18', icon: '🐱', description: '性格亲人，喜欢被摸下巴，已适应室内生活。' },
      { id: 2, pet_code: 'PET-2026-002', name: '奶糖', category_id: 1, breed: '布偶猫', gender: '母', age_month: 10, weight_kg: 3.5, health_status: 'healthy', status: 'available', intake_date: '2026-07-02', icon: '😽', description: '安静粘人，适合有耐心的家庭。' },
      { id: 3, pet_code: 'PET-2026-003', name: '豆豆', category_id: 2, breed: '中华田园犬', gender: '公', age_month: 24, weight_kg: 12, health_status: 'healthy', status: 'available', intake_date: '2026-05-11', icon: '🐶', description: '精力旺盛，适合有院子的家庭，会看家。' },
      { id: 4, pet_code: 'PET-2026-004', name: '雪球', category_id: 2, breed: '萨摩耶', gender: '母', age_month: 14, weight_kg: 15, health_status: 'recovering', status: 'available', intake_date: '2026-08-09', icon: '🐕', description: '笑容治愈，正在康复期，需定期复查。' },
      { id: 5, pet_code: 'PET-2026-005', name: '小灰', category_id: 1, breed: '狸花猫', gender: '公', age_month: 8, weight_kg: 3.2, health_status: 'healthy', status: 'available', intake_date: '2026-09-01', icon: '🐈', description: '活泼好动，喜欢追逗猫棒。' },
      { id: 6, pet_code: 'PET-2026-006', name: '团团', category_id: 2, breed: '柯基', gender: '母', age_month: 20, weight_kg: 10, health_status: 'healthy', status: 'available', intake_date: '2026-06-30', icon: '🐕', description: '短腿小可爱，性格开朗，和小孩相处友好。' },
      { id: 7, pet_code: 'PET-2026-007', name: '布丁', category_id: 3, breed: '垂耳兔', gender: '母', age_month: 12, weight_kg: 1.8, health_status: 'healthy', status: 'available', intake_date: '2026-07-20', icon: '🐰', description: '温顺安静，吃草为主，需要固定笼舍。' },
      { id: 8, pet_code: 'PET-2026-008', name: '团子', category_id: 4, breed: '金丝熊', gender: '公', age_month: 8, weight_kg: 0.4, health_status: 'healthy', status: 'available', intake_date: '2026-08-25', icon: '🐹', description: '爱跑轮，夜间活动，单独饲养。' },
      { id: 9, pet_code: 'PET-2026-009', name: '可乐', category_id: 2, breed: '边牧', gender: '公', age_month: 36, weight_kg: 18, health_status: 'healthy', status: 'adopted', intake_date: '2026-04-10', icon: '🐕‍🦺', description: '聪明听话，已找到新家。' },
      { id: 10, pet_code: 'PET-2026-010', name: '花卷', category_id: 1, breed: '三花猫', gender: '母', age_month: 30, weight_kg: 4.5, health_status: 'healthy', status: 'available', intake_date: '2026-03-08', icon: '🐱', description: '安静懂事，脾气很好。' }
    ],
    applications: [
      { id: 1, apply_code: 'APL-20260928-001', pet_id: 5, user_id: 2, reason: '独居上班族，晚上有时间陪伴，有养猫经验。', phone: '13812345678', status: 'pending', apply_date: '2026-09-28', review_note: '' },
      { id: 2, apply_code: 'APL-20260915-002', pet_id: 9, user_id: 2, reason: '有院子，喜欢运动，时间充足。', phone: '13812345678', status: 'completed', apply_date: '2026-09-15', review_note: '已领养并回访。' },
      { id: 3, apply_code: 'APL-20261002-003', pet_id: 1, user_id: 3, reason: '想领养一只性格亲人的猫。', phone: '13987654321', status: 'approved', apply_date: '2026-10-02', review_note: '资料齐全，待签约。' },
      { id: 4, apply_code: 'APL-20261005-004', pet_id: 2, user_id: 3, reason: '喜欢布偶猫。', phone: '13987654321', status: 'rejected', apply_date: '2026-10-05', review_note: '合租房需补充房东同意材料。' }
    ]
  };
}

/* ---------- 初始化 ---------- */
DB = (function () { if (!storageOK) return null; try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } })();
if (!DB || !DB.pets || !DB.users) { DB = seed(); save(); }
if (storageOK) { var s = localStorage.getItem(SK); uid = s ? Number(s) : null; }
if (uid && !me()) uid = null;

/* ---------- 路由 ---------- */
function seg() { return (location.hash || '#/').replace(/^#\/?/, '').split('/').filter(Boolean); }
function go(h) { if (location.hash === h) render(); else location.hash = h; }
window.addEventListener('hashchange', render);

function render() {
  var s = seg(), a = s[0] || 'home', c = '';
  if (a === 'home') { viewName = 'home'; c = viewHome(); }
  else if (a === 'pet') { viewName = 'pet'; c = viewPet(Number(s[1])); }
  else if (a === 'apply') { viewName = 'apply'; c = viewApply(Number(s[1])); }
  else if (a === 'mine') { viewName = 'mine'; c = viewMine(); }
  else if (a === 'login') { viewName = 'login'; c = viewLogin(); }
  else if (a === 'register') { viewName = 'register'; c = viewRegister(); }
  else if (a === 'reset') { viewName = 'reset'; c = viewReset(); }
  else if (a === 'admin' && s[1] === 'pets') {
    viewName = 'admin';
    if (s[2] === 'new') c = viewPetForm(null);
    else if (s[2] && s[3] === 'edit') c = viewPetForm(Number(s[2]));
    else c = viewAdminPets();
  }
  else if (a === 'admin' && s[1] === 'apps') { viewName = 'admin'; c = viewAdminApps(); }
  else { viewName = '404'; c = '<div class="empty"><div class="i">🐾</div><div>页面不见了</div><div style="margin-top:12px"><a class="btn p" href="#/">回首页</a></div></div>'; }

  document.getElementById('nav').innerHTML = nav();
  var b = storageOK ? '' : '<div class="flash warn">浏览器禁用了本地存储，刷新后数据会丢失，建议用 Chrome / Edge 打开。</div>';
  var f = flash ? '<div class="flash ' + flash.k + '">' + esc(flash.t) + '</div>' : '';
  document.getElementById('app').innerHTML = b + f + c;
}

function nav() {
  var u = me(), l = '';
  function A(h, t, on) { return '<a href="' + h + '"' + (on ? ' class="on"' : '') + '>' + t + '</a>'; }
  l += A('#/', '宠物之家', viewName === 'home');
  if (u) l += A('#/mine', '我的申请', viewName === 'mine');
  if (u && u.role === 'admin') {
    l += A('#/admin/pets', '宠物管理', viewName === 'admin');
    l += A('#/admin/apps', '申请审核', viewName === 'admin');
  }
  var r = u
    ? '<div class="nav-user">' + esc(u.real_name) + (u.role === 'admin' ? '（管理员）' : '') + '<button class="btn g s" data-act="logout">退出</button></div>'
    : '<div class="nav-user"><a class="btn p s" href="#/login">登录</a><a class="btn g s" href="#/register">注册</a></div>';
  return '<div class="brand">🐾 宠物之家</div><div class="nav-links">' + l + '</div>' + r;
}

/* ---------- 前台 ---------- */
function viewHome() {
  var list = DB.pets.filter(function (p) {
    if (filters.cat && Number(p.category_id) !== Number(filters.cat)) return false;
    if (filters.kw) {
      var k = filters.kw.toLowerCase();
      if ((p.name + p.breed + p.pet_code).toLowerCase().indexOf(k) < 0) return false;
    }
    return true;
  });
  var opts = '<option value="">全部分类</option>' + DB.categories.map(function (c) {
    return '<option value="' + c.id + '"' + (String(filters.cat) === String(c.id) ? ' selected' : '') + '>' + esc(c.name) + '</option>';
  }).join('');
  var cards = list.map(function (p) {
    return '<a class="pet" href="#/pet/' + p.id + '"><div class="thumb">' + esc(p.icon) + '</div><div class="pbody">' +
      '<div class="pname"><span>' + esc(p.name) + '</span><span class="badge ' + p.status + '">' + PS[p.status] + '</span></div>' +
      '<div class="pmeta">' + esc(cname(p.category_id)) + ' · ' + esc(p.breed) + ' · ' + esc(p.gender) + '</div>' +
      '<div class="pdesc">' + esc(p.description) + '</div>' +
      '<div style="margin-top:10px" class="code">' + esc(p.pet_code) + '</div></div></a>';
  }).join('');
  return '<h2 class="t">宠物之家</h2><p class="sub">共 ' + list.length + ' 只宠物</p>' +
    '<form class="bar" data-action="filter">' +
      '<input type="text" name="kw" value="' + esc(filters.kw) + '" placeholder="搜索名称 / 品种 / 编号">' +
      '<select name="cat">' + opts + '</select>' +
      '<button class="btn p s" type="submit">筛选</button>' +
      '<button class="btn g s" type="button" data-act="resetFilter">重置</button>' +
    '</form>' +
    (cards ? '<div class="grid">' + cards + '</div>' : '<div class="empty"><div class="i">🐾</div><div>没有符合条件的宠物</div></div>');
}

function viewPet(id) {
  var p = DB.pets.filter(function (x) { return x.id === id; })[0];
  if (!p) return '<div class="empty"><div class="i">🐾</div><div>宠物不存在</div></div>';
  var u = me();
  var mine = u && DB.applications.some(function (a) { return a.user_id === u.id && a.pet_id === p.id && a.status !== 'cancelled' && a.status !== 'rejected'; });
  var btn = p.status !== 'available' ? '<button class="btn g" disabled>已被领养</button>'
    : !u ? '<a class="btn p" href="#/login">登录后申请</a>'
    : mine ? '<button class="btn g" disabled>你已提交申请</button>'
    : '<a class="btn p" href="#/apply/' + p.id + '">申请领养</a>';
  return '<h2 class="t">' + esc(p.name) + ' <span class="badge ' + p.status + '">' + PS[p.status] + '</span></h2>' +
    '<p class="sub code">' + esc(p.pet_code) + ' · 入站日期 ' + esc(p.intake_date) + '</p>' +
    '<div class="detail"><div class="big">' + esc(p.icon) + '</div>' +
      '<div class="card"><div style="font-size:15px;font-weight:700">基本信息</div>' +
        '<div class="infolist">' +
          '<div><div class="k">分类</div>' + esc(cname(p.category_id)) + '</div>' +
          '<div><div class="k">品种</div>' + esc(p.breed) + '</div>' +
          '<div><div class="k">性别</div>' + esc(p.gender) + '</div>' +
          '<div><div class="k">年龄</div>' + (Math.round(p.age_month / 12 * 10) / 10) + ' 岁</div>' +
          '<div><div class="k">体重</div>' + esc(p.weight_kg) + ' kg</div>' +
          '<div><div class="k">健康状况</div>' + (HE[p.health_status] || '健康') + '</div>' +
        '</div>' +
        '<div style="margin-top:18px">' + btn + '</div>' +
      '</div></div>' +
    '<div class="card"><div style="font-weight:700;margin-bottom:8px">宠物介绍</div>' +
      '<div style="color:#555;font-size:13.5px">' + esc(p.description || '暂无介绍') + '</div></div>' +
    '<div style="margin-top:16px"><a class="btn g s" href="#/">← 返回列表</a></div>';
}

function viewApply(id) {
  var u = me(), p = DB.pets.filter(function (x) { return x.id === id; })[0];
  if (!p) return '<div class="empty"><div class="i">🐾</div><div>宠物不存在</div></div>';
  if (!u) return authBox('请先登录后再申请');
  if (p.status !== 'available') return '<div class="card"><h2 class="t">无法申请</h2><p class="sub">该宠物已被领养。</p><a class="btn g s" href="#/pet/' + p.id + '">返回</a></div>';
  return '<h2 class="t">申请领养 · ' + esc(p.name) + '</h2><p class="sub">' + esc(p.pet_code) + ' · ' + esc(cname(p.category_id)) + ' · ' + esc(p.breed) + '</p>' +
    '<div class="card"><form data-action="apply" data-pet="' + p.id + '">' +
      '<div class="form">' +
        '<div class="fg full"><label>申请理由 *</label><textarea name="reason" required placeholder="居住情况、家庭情况、养宠经验、每天陪伴时间"></textarea></div>' +
        '<div class="fg"><label>联系电话 *</label><input type="text" name="phone" value="' + esc(u.phone) + '" required></div>' +
      '</div>' +
      '<div class="hint" style="margin-top:12px">提交后由管理员审核，通过后会电话联系你。</div>' +
      '<div style="margin-top:18px"><button class="btn p" type="submit">提交申请</button> <a class="btn g" href="#/pet/' + p.id + '">取消</a></div>' +
    '</form></div>';
}

function viewMine() {
  var u = me();
  if (!u) return authBox('登录后可查看自己的申请');
  var rows = DB.applications.filter(function (a) { return a.user_id === u.id; });
  if (!rows.length) return '<h2 class="t">我的申请</h2><div class="empty"><div class="i">📄</div><div>还没有提交过申请</div><div style="margin-top:12px"><a class="btn p" href="#/">去看看</a></div></div>';
  var body = rows.map(function (a) {
    var p = DB.pets.filter(function (x) { return x.id === a.pet_id; })[0];
    return '<tr><td class="code">' + esc(a.apply_code) + '</td><td>' + (p ? esc(p.icon) + ' ' + esc(p.name) : '—') + '</td>' +
      '<td>' + esc(a.apply_date) + '</td><td><span class="badge ' + a.status + '">' + AS[a.status] + '</span></td>' +
      '<td style="max-width:240px;color:#666">' + esc(a.review_note || '—') + '</td>' +
      '<td class="acts">' + ((a.status === 'pending' || a.status === 'approved') ? '<button class="btn g s" data-act="cancelApp" data-id="' + a.id + '">取消</button>' : '—') + '</td></tr>';
  }).join('');
  return '<h2 class="t">我的申请</h2><p class="sub">共 ' + rows.length + ' 条</p>' +
    '<div class="card" style="padding:0"><div class="tw"><table><thead><tr><th>申请编号</th><th>宠物</th><th>申请日期</th><th>状态</th><th>审核意见</th><th>操作</th></tr></thead><tbody>' + body + '</tbody></table></div></div>';
}

function authBox(msg) {
  return '<div class="auth"><div class="card" style="text-align:center"><div style="font-size:40px">🔒</div>' +
    '<h3 style="margin-top:8px">需要登录</h3><p>' + esc(msg) + '</p>' +
    '<a class="btn p" href="#/login">去登录</a> <a class="btn g" href="#/register">注册</a></div></div>';
}

/* ---------- 后台 ---------- */
function isAdmin() { var u = me(); return !!u && u.role === 'admin'; }
function adminDeny() {
  if (!me()) return authBox('请先登录管理员账号');
  return '<div class="card"><h2 class="t">无访问权限</h2><p class="sub">当前账号不是管理员。</p><a class="btn g" href="#/">返回首页</a></div>';
}

function viewAdminPets() {
  if (!isAdmin()) return adminDeny();
  var total = DB.pets.length;
  var avail = DB.pets.filter(function (p) { return p.status === 'available'; }).length;
  var adopted = DB.pets.filter(function (p) { return p.status === 'adopted'; }).length;
  var pend = DB.applications.filter(function (a) { return a.status === 'pending'; }).length;
  var rows = DB.pets.map(function (p) {
    return '<tr><td class="code">' + esc(p.pet_code) + '</td><td>' + esc(p.icon) + ' <b>' + esc(p.name) + '</b></td>' +
      '<td>' + esc(cname(p.category_id)) + '</td><td>' + esc(p.gender) + '</td>' +
      '<td><span class="badge ' + p.status + '">' + PS[p.status] + '</span></td>' +
      '<td class="acts"><a href="#/admin/pets/' + p.id + '/edit">编辑</a><button class="btn g s" data-act="delPet" data-id="' + p.id + '">删除</button></td></tr>';
  }).join('');
  return '<h2 class="t">宠物管理</h2><p class="sub">管理员可录入、修改、删除宠物档案</p>' +
    '<div class="stats">' +
      '<div class="stat"><div class="l">宠物总数</div><div class="v">' + total + '</div></div>' +
      '<div class="stat"><div class="l">待领养</div><div class="v">' + avail + '</div></div>' +
      '<div class="stat"><div class="l">已领养</div><div class="v">' + adopted + '</div></div>' +
      '<div class="stat"><div class="l">待审核申请</div><div class="v">' + pend + '</div></div>' +
    '</div>' +
    '<div style="margin-bottom:14px"><a class="btn p" href="#/admin/pets/new">+ 录入新宠物</a></div>' +
    '<div class="card" style="padding:0"><div class="tw"><table><thead><tr><th>编号</th><th>宠物</th><th>分类</th><th>性别</th><th>状态</th><th>操作</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
}

function petFields(p) {
  p = p || {};
  var cat = DB.categories.map(function (c) { return '<option value="' + c.id + '"' + (p.category_id === c.id ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('');
  var gd = ['公', '母', '未知'].map(function (g) { return '<option' + (p.gender === g ? ' selected' : '') + '>' + g + '</option>'; }).join('');
  var he = Object.keys(HE).map(function (k) { return '<option value="' + k + '"' + (p.health_status === k ? ' selected' : '') + '>' + HE[k] + '</option>'; }).join('');
  var st = Object.keys(PS).map(function (k) { return '<option value="' + k + '"' + (p.status === k ? ' selected' : '') + '>' + PS[k] + '</option>'; }).join('');
  return '<div class="form">' +
    '<div class="fg"><label>宠物名称 *</label><input name="name" value="' + esc(p.name || '') + '" required></div>' +
    '<div class="fg"><label>分类</label><select name="category_id">' + cat + '</select></div>' +
    '<div class="fg"><label>品种</label><input name="breed" value="' + esc(p.breed || '') + '"></div>' +
    '<div class="fg"><label>性别</label><select name="gender">' + gd + '</select></div>' +
    '<div class="fg"><label>月龄</label><input type="number" name="age_month" min="0" value="' + esc(p.age_month != null ? p.age_month : 0) + '"></div>' +
    '<div class="fg"><label>体重（kg）</label><input type="number" step="0.1" name="weight_kg" min="0" value="' + esc(p.weight_kg != null ? p.weight_kg : 0) + '"></div>' +
    '<div class="fg"><label>健康状况</label><select name="health_status">' + he + '</select></div>' +
    '<div class="fg"><label>状态</label><select name="status">' + st + '</select></div>' +
    '<div class="fg"><label>入站日期</label><input type="date" name="intake_date" value="' + esc(p.intake_date || today()) + '"></div>' +
    '<div class="fg"><label>图标（Emoji）</label><input name="icon" maxlength="4" value="' + esc(p.icon || '🐾') + '"></div>' +
    '<div class="fg full"><label>介绍</label><textarea name="description">' + esc(p.description || '') + '</textarea></div>' +
    '</div>';
}

function viewPetForm(id) {
  if (!isAdmin()) return adminDeny();
  var p = null;
  if (id) {
    p = DB.pets.filter(function (x) { return x.id === id; })[0];
    if (!p) return '<div class="empty"><div class="i">🐾</div><div>宠物不存在</div></div>';
  }
  return '<h2 class="t">' + (p ? '编辑宠物 · ' + esc(p.name) : '录入新宠物') + '</h2>' +
    '<p class="sub">' + (p ? esc(p.pet_code) : '编号自动生成，格式 PET-' + new Date().getFullYear() + '-XXX') + '</p>' +
    '<div class="card"><form data-action="savePet" data-id="' + (p ? p.id : '') + '">' + petFields(p) +
      '<div style="margin-top:18px"><button class="btn p" type="submit">保存</button> <a class="btn g" href="#/admin/pets">取消</a></div></form></div>';
}

function viewAdminApps() {
  if (!isAdmin()) return adminDeny();
  var rows = DB.applications.map(function (a) {
    var p = DB.pets.filter(function (x) { return x.id === a.pet_id; })[0];
    var u = DB.users.filter(function (x) { return x.id === a.user_id; })[0];
    var acts = a.status === 'pending'
      ? '<button class="btn p s" data-act="approveApp" data-id="' + a.id + '">通过</button><button class="btn g s" data-act="rejectApp" data-id="' + a.id + '">驳回</button>'
      : a.status === 'approved' ? '<button class="btn p s" data-act="completeApp" data-id="' + a.id + '">完成领养</button>' : '—';
    return '<tr><td class="code">' + esc(a.apply_code) + '</td><td>' + (p ? esc(p.icon) + ' ' + esc(p.name) : '—') + '</td>' +
      '<td>' + esc(u ? u.real_name : '—') + '<div class="hint">' + esc(u ? u.phone : '') + '</div></td>' +
      '<td style="max-width:200px;color:#666">' + esc(a.reason) + '</td>' +
      '<td>' + esc(a.apply_date) + '</td><td><span class="badge ' + a.status + '">' + AS[a.status] + '</span></td>' +
      '<td class="acts">' + acts + '</td></tr>';
  }).join('');
  return '<h2 class="t">申请审核</h2><p class="sub">共 ' + DB.applications.length + ' 条申请</p>' +
    '<div class="card" style="padding:0"><div class="tw"><table><thead><tr><th>编号</th><th>宠物</th><th>申请人</th><th>理由</th><th>日期</th><th>状态</th><th>操作</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
}

/* ---------- 登录相关 ---------- */
function viewLogin() {
  return '<div class="auth"><div class="card"><h3>登录</h3><p>登录后可申请领养</p><form data-action="login">' +
    '<div class="fg" style="margin-bottom:12px"><label>登录名</label><input name="username" required placeholder="admin 或 zhangsan"></div>' +
    '<div class="fg" style="margin-bottom:16px"><label>密码</label><input type="password" name="password" required></div>' +
    '<button class="btn p" type="submit" style="width:100%">登录</button></form>' +
    '<div class="hint" style="text-align:center;margin-top:14px">没有账号？<a href="#/register">注册</a> · <a href="#/reset">忘记密码？</a></div>' +
    '<div class="hint" style="text-align:center;margin-top:8px">演示账号：admin / admin123</div></div></div>';
}

function viewRegister() {
  return '<div class="auth"><div class="card"><h3>注册</h3><p>注册后可以提交领养申请</p><form data-action="register">' +
    '<div class="fg" style="margin-bottom:12px"><label>登录名 *</label><input name="username" required></div>' +
    '<div class="fg" style="margin-bottom:12px"><label>密码 *</label><input type="password" name="password" required placeholder="至少 6 位"></div>' +
    '<div class="fg" style="margin-bottom:12px"><label>姓名 *</label><input name="real_name" required></div>' +
    '<div class="fg" style="margin-bottom:16px"><label>手机号 *</label><input name="phone" required></div>' +
    '<button class="btn p" type="submit" style="width:100%">注册</button></form>' +
    '<div class="hint" style="text-align:center;margin-top:14px">已有账号？<a href="#/login">去登录</a></div></div></div>';
}

function viewReset() {
  var list = DB.users.map(function (u) { return '<a href="#/reset">' + esc(u.username) + '</a>（' + esc(u.real_name) + '）'; }).join('、');
  return '<div class="auth" style="max-width:460px"><div class="card"><h3>找回密码</h3>' +
    '<p>输入登录名和注册时的手机号，验证后即可设置新密码</p><form data-action="resetPwd">' +
    '<div class="fg" style="margin-bottom:12px"><label>登录名 *</label><input name="username" required></div>' +
    '<div class="fg" style="margin-bottom:12px"><label>手机号 *</label><input name="phone" required></div>' +
    '<div class="fg" style="margin-bottom:12px"><label>新密码 *</label><input type="password" name="new_password" required></div>' +
    '<div class="fg" style="margin-bottom:16px"><label>确认新密码 *</label><input type="password" name="confirm" required></div>' +
    '<button class="btn p" type="submit" style="width:100%">重置密码</button></form>' +
    '<div class="hint" style="margin-top:14px">本机账号：' + list + '</div>' +
    '<div class="hint" style="margin-top:8px">纯前端版没有短信服务，如果手机号也忘了，只能恢复演示数据。</div>' +
    '<div class="hint" style="text-align:center;margin-top:12px"><a href="#/login">← 返回登录</a></div></div></div>';
}

/* ---------- 表单提交 ---------- */
function v(f, n) { var e = f.elements[n]; return e ? String(e.value || '').trim() : ''; }

document.addEventListener('submit', function (e) {
  var f = e.target, act = f.getAttribute('data-action');
  if (!act) return;
  e.preventDefault();

  if (act === 'filter') { filters.kw = v(f, 'kw'); filters.cat = v(f, 'cat'); render(); return; }

  if (act === 'login') {
    var u = DB.users.filter(function (x) { return x.username === v(f, 'username') && x.password === v(f, 'password'); })[0];
    if (!u) { setFlash('登录名或密码不正确', 'danger'); render(); return; }
    uid = u.id; saveSession();
    setFlash('欢迎回来，' + u.real_name); go('#/'); render(); return;
  }

  if (act === 'register') {
    var un = v(f, 'username'), pw = v(f, 'password');
    if (pw.length < 6) { setFlash('密码至少 6 位', 'danger'); render(); return; }
    if (DB.users.some(function (x) { return x.username === un; })) { setFlash('登录名已被占用', 'danger'); render(); return; }
    var nu = { id: nid(DB.users), user_code: nextUserCode(), username: un, password: pw, real_name: v(f, 'real_name'), phone: v(f, 'phone'), role: 'user' };
    DB.users.push(nu); uid = nu.id; saveSession(); save();
    setFlash('注册成功'); go('#/'); render(); return;
  }

  if (act === 'resetPwd') {
    var tu = DB.users.filter(function (x) { return x.username === v(f, 'username'); })[0];
    if (!tu) { setFlash('没有找到这个登录名', 'danger'); render(); return; }
    if (v(f, 'phone') !== String(tu.phone || '')) { setFlash('手机号与注册信息不一致', 'danger'); render(); return; }
    if (v(f, 'new_password').length < 6) { setFlash('新密码至少 6 位', 'danger'); render(); return; }
    if (v(f, 'new_password') !== v(f, 'confirm')) { setFlash('两次输入的密码不一致', 'danger'); render(); return; }
    tu.password = v(f, 'new_password'); save();
    setFlash('密码已重置，请用新密码登录'); go('#/login'); render(); return;
  }

  if (act === 'apply') {
    var u2 = me(), pid = Number(f.getAttribute('data-pet'));
    if (!u2) { setFlash('请先登录', 'danger'); go('#/login'); render(); return; }
    var p = DB.pets.filter(function (x) { return x.id === pid; })[0];
    if (!p || p.status !== 'available') { setFlash('该宠物当前不可申请', 'warn'); render(); return; }
    DB.applications.push({ id: nid(DB.applications), apply_code: nextApplyCode(), pet_id: pid, user_id: u2.id, reason: v(f, 'reason'), phone: v(f, 'phone'), status: 'pending', apply_date: today(), review_note: '' });
    save(); setFlash('申请已提交，等待管理员审核'); go('#/mine'); render(); return;
  }

  if (act === 'savePet') {
    if (!isAdmin()) { setFlash('无权限', 'danger'); render(); return; }
    var d = {
      name: v(f, 'name'), category_id: Number(v(f, 'category_id')) || 5, breed: v(f, 'breed'),
      gender: v(f, 'gender') || '未知', age_month: Number(v(f, 'age_month')) || 0,
      weight_kg: Number(v(f, 'weight_kg')) || 0, health_status: v(f, 'health_status') || 'healthy',
      status: v(f, 'status') || 'available', intake_date: v(f, 'intake_date') || today(),
      icon: v(f, 'icon') || '🐾', description: v(f, 'description')
    };
    var eid = Number(f.getAttribute('data-id')) || 0;
    if (eid) {
      var tp = DB.pets.filter(function (x) { return x.id === eid; })[0];
      if (tp) Object.keys(d).forEach(function (k) { tp[k] = d[k]; });
    } else {
      d.id = nid(DB.pets); d.pet_code = nextPetCode(); DB.pets.push(d);
    }
    save(); setFlash('保存成功'); go('#/admin/pets'); render(); return;
  }
});

/* ---------- 按钮 ---------- */
document.addEventListener('click', function (e) {
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var act = el.getAttribute('data-act'), id = Number(el.getAttribute('data-id')), u = me();

  if (act === 'logout') { uid = null; saveSession(); setFlash('已退出登录', 'warn'); go('#/'); render(); return; }
  if (act === 'resetFilter') { filters = { kw: '', cat: '' }; render(); return; }

  if (act === 'cancelApp') {
    var a = DB.applications.filter(function (x) { return x.id === id; })[0];
    if (!a || !confirm('确定取消这条申请？')) return;
    a.status = 'cancelled'; save(); setFlash('申请已取消', 'warn'); render(); return;
  }

  if (act === 'delPet') {
    if (!isAdmin() || !confirm('确定删除该宠物档案？')) return;
    DB.pets = DB.pets.filter(function (x) { return x.id !== id; });
    save(); setFlash('已删除', 'warn'); render(); return;
  }

  if (act === 'approveApp' || act === 'rejectApp' || act === 'completeApp') {
    if (!isAdmin()) { setFlash('无权限', 'danger'); render(); return; }
    var ap = DB.applications.filter(function (x) { return x.id === id; })[0];
    if (!ap) return;
    if (act === 'approveApp') { ap.status = 'approved'; ap.review_note = '资料审核通过，等待签约。'; }
    else if (act === 'rejectApp') { var n = prompt('驳回原因（可留空）：', ''); ap.status = 'rejected'; ap.review_note = n || '不符合领养条件。'; }
    else {
      if (!confirm('确认完成领养？宠物状态将变为已领养。')) return;
      ap.status = 'completed'; ap.review_note = '已完成领养。';
      var pt = DB.pets.filter(function (x) { return x.id === ap.pet_id; })[0];
      if (pt) {
        pt.status = 'adopted';
        DB.applications.forEach(function (o) {
          if (o.pet_id === pt.id && o.id !== ap.id && (o.status === 'pending' || o.status === 'approved')) { o.status = 'rejected'; o.review_note = '该宠物已被他人领养。'; }
        });
      }
    }
    save(); setFlash('操作成功：' + AS[ap.status], 'success'); render(); return;
  }
});

/* ---------- 启动 ---------- */
if (!location.hash) location.hash = '#/';
render();
})();
</script>
</body>
</html>
